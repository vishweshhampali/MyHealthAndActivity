name: Notion Data Layer Sync

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 06:30 IST
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to sync (YYYY-MM-DD) — leave blank for yesterday'
        required: false
      start_date:
        description: 'Backfill start date (YYYY-MM-DD) — leave blank unless backfilling'
        required: false
      end_date:
        description: 'Backfill end date (YYYY-MM-DD) — leave blank unless backfilling'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: notion-data-layer-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r notion-data-layer/requirements.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run sync
        working-directory: notion-data-layer
        env:
          GCP_PROJECT: vishactivitytracker
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SYNC_DATE: ${{ github.event.inputs.date }}
          SYNC_START_DATE: ${{ github.event.inputs.start_date }}
          SYNC_END_DATE: ${{ github.event.inputs.end_date }}
        run: python sync.py
