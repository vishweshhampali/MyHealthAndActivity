name: sync-and-transform
on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily — GitHub's cron is best-effort, expect some drift
  workflow_dispatch: {}

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - name: checkout this repo
        uses: actions/checkout@v4

      - name: checkout ghealth source
        uses: actions/checkout@v4
        with:
          repository: Google-Health-API/google-health-cli
          path: ghealth-src

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: ghealth-src/go.sum

      - name: build ghealth
        working-directory: ghealth-src
        run: |
          go build -o ghealth .
          echo "$PWD" >> $GITHUB_PATH

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install python deps
        run: pip install -r fitness-warehouse/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: restore ghealth auth
        run: |
          mkdir -p ~/.config/ghealth
          echo "${{ secrets.GHEALTH_CLIENT_SECRET_B64 }}" | base64 -d > ~/.config/ghealth/client_secret.json
          echo "${{ secrets.GHEALTH_CREDS_B64 }}" | base64 -d > /tmp/ghealth-creds.json
          ghealth auth import --file /tmp/ghealth-creds.json

      - name: run loader
        run: python fitness-warehouse/loader/sync.py

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: fitness-warehouse/logs/

  dbt:
    needs: load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install dbt-bigquery

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: write dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          fitness_warehouse:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: vishactivitytracker
                dataset: dbt_vish
                location: US
                threads: 4
          PROFILE

      - name: dbt deps (only if packages.yml exists)
        working-directory: fitness-warehouse/dbt/fitness_warehouse
        run: |
          if [ -f packages.yml ]; then dbt deps; fi

      - name: dbt run
        working-directory: fitness-warehouse/dbt/fitness_warehouse
        run: dbt run

      - name: dbt test
        working-directory: fitness-warehouse/dbt/fitness_warehouse
        run: dbt test
