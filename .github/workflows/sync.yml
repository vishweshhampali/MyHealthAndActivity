name: sync-and-transform
on:
  workflow_dispatch: {}

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - name: checkout this repo
        uses: actions/checkout@v4

      - name: checkout ghealth source
        uses: actions/checkout@v4
        with:
          repository: Google-Health-API/google-health-cli
          path: ghealth-src

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: ghealth-src/go.sum

      - name: build ghealth
        working-directory: ghealth-src
        run: |
          go build -o ghealth .
          echo "$PWD" >> $GITHUB_PATH

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install python deps
        run: pip install -r loader/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: restore ghealth auth
        run: |
          mkdir -p ~/.config/ghealth
          echo "${{ secrets.GHEALTH_CLIENT_SECRET_B64 }}" | base64 -d > ~/.config/ghealth/client_secret.json
          echo "${{ secrets.GHEALTH_CREDS_B64 }}" | base64 -d > /tmp/ghealth-creds.json
          ghealth auth import --file /tmp/ghealth-creds.json

      - name: run loader
        run: python loader/sync.py

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: logs/
